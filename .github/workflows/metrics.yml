# ──────────────────────────────────────────────────────────────────────────────
# GitHub Actions: Weekly Profile Metrics Card Generator
# Generates rich visual metrics for the GitHub profile README.
# ──────────────────────────────────────────────────────────────────────────────
name: 📊 Generate Profile Metrics

on:
  schedule:
    - cron: "0 2 * * 0"   # Every Sunday at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📊 Render GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tanmoyde2010-ops
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: B
          output_action: gist
          committer_message: "📊 Auto-updated profile metrics [skip ci]"
